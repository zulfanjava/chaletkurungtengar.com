<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - Chalet Kurung Tengar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .success-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: #4caf50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        
        .success-icon i {
            font-size: 40px;
            color: white;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .booking-id {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 18px;
            color: #667eea;
        }
        
        .message {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .button {
            display: inline-block;
            background: #333;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 20px;
            transition: transform 0.3s, background 0.3s;
        }
        
        .button:hover {
            background: #555;
            transform: translateY(-2px);
        }
        
        .loading {
            color: #666;
            margin: 20px 0;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .details {
            text-align: left;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }
        
        .details p {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }
        
        .details strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="success-card" id="success-card">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1>Payment Successful!</h1>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Verifying your payment...</p>
        </div>
        <div id="content" style="display: none;">
            <p class="message">Thank you for your payment. Your booking is now confirmed.</p>
            <div class="booking-id" id="booking-id-display">Loading...</div>
            <div class="details" id="booking-details"></div>
            <a href="index.html" class="button">
                <i class="fas fa-home"></i> Return to Homepage
            </a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDdJoegR4pbGPmDPzQ52_xEVAvnXoObvCw",
            authDomain: "chalet-kurung-tengar.firebaseapp.com",
            projectId: "chalet-kurung-tengar",
            storageBucket: "chalet-kurung-tengar.firebasestorage.app",
            messagingSenderId: "650202016501",
            appId: "1:650202016501:web:13d53090373d47dc1573bc"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function getBookingDetails(bookingId) {
            try {
                const snapshot = await db.collection('bookings')
                    .where('bookingId', '==', bookingId)
                    .get();
                
                if (!snapshot.empty) {
                    const booking = snapshot.docs[0].data();
                    return { id: snapshot.docs[0].id, ...booking };
                }
                return null;
            } catch (error) {
                console.error('Error fetching booking:', error);
                return null;
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                weekday: 'short', 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        async function main() {
            const urlParams = new URLSearchParams(window.location.search);
            const bookingId = urlParams.get('bookingId');
            
            if (!bookingId) {
                document.getElementById('loading').innerHTML = '<p style="color: red;">No booking ID found. Please contact support.</p>';
                return;
            }
            
            document.getElementById('booking-id-display').textContent = `Booking ID: ${bookingId}`;
            
            // Wait a moment for Firebase to update
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            const booking = await getBookingDetails(bookingId);
            
            if (booking && booking.status === 'confirmed') {
                const roomNames = {
                    'queen': 'Standard Queen Room (Upper Floor)',
                    'seaview': 'Seaview Queen (Upper Floor)',
                    'triple': 'Seaview Triple Room (Ground Floor)',
                    'standard': 'Standard Triple Room (Ground Floor)',
                    'family': 'Standard Family Room (Ground Floor)',
                    'superior': 'Superior Seaview Room (Ground Floor)',
                    'seaview-family': 'Seaview Family Room (Ground Floor)'
                };
                
                document.getElementById('booking-details').innerHTML = `
                    <p><strong>Guest Name:</strong> ${booking.name || '-'}</p>
                    <p><strong>Room:</strong> ${roomNames[booking.roomType] || booking.roomType}</p>
                    <p><strong>Check-in:</strong> ${formatDate(booking.checkIn)}</p>
                    <p><strong>Check-out:</strong> ${formatDate(booking.checkOut)}</p>
                    <p><strong>Guests:</strong> ${booking.guests} pax</p>
                    <p><strong>Total Paid:</strong> RM ${booking.totalPrice?.toFixed(2) || '0.00'}</p>
                `;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } else {
                document.getElementById('loading').innerHTML = `
                    <p style="color: orange;">Payment is being processed. Please wait a moment...</p>
                    <div class="spinner"></div>
                `;
                
                // Poll for status update
                let attempts = 0;
                const checkInterval = setInterval(async () => {
                    attempts++;
                    const updatedBooking = await getBookingDetails(bookingId);
                    
                    if (updatedBooking && updatedBooking.status === 'confirmed') {
                        clearInterval(checkInterval);
                        window.location.reload();
                    } else if (attempts > 30) {
                        clearInterval(checkInterval);
                        document.getElementById('loading').innerHTML = `
                            <p style="color: red;">Payment verification taking longer than expected.</p>
                            <p>Please contact admin at +60 12-909 7591 with your Booking ID: ${bookingId}</p>
                            <a href="index.html" class="button" style="margin-top: 20px;">Return to Homepage</a>
                        `;
                    }
                }, 3000);
            }
        }
        
        main();
    </script>
</body>
</html>
